<!DOCTYPE html>
<html>
<head>
 <title>T-Rex Game</title>
 <style>
   body { font-family: 'Arial', sans-serif; }
   .game-container { position: relative; width: 600px; height: 150px; border: 1px solid #000; overflow: hidden; }
   .dino { position: absolute; bottom: 0; width: 40px; height: 40px; background-color: #000; }
   .obstacle { position: absolute; bottom: 0; width: 20px; height: 40px; background-color: #000; }
 </style>
</head>
<body>
 <div class="game-container">
   <div class="dino" id="dino"></div>
   <div class="obstacle" id="obstacle"></div>
 </div>
 <script>
   let dino = document.getElementById('dino');
   let obstacle = document.getElementById('obstacle');
   let isJumping = false;
   let gravity = 0.9;
   document.addEventListener('keydown', function(event) {
     if (event.key === ' ') {
       jump();
     }
   });
   function jump() {
     if (isJumping) return;
     let position = 0;
     isJumping = true;
     let upInterval = setInterval(() => {
       if (position >= 150) {
         clearInterval(upInterval);
         let downInterval = setInterval(() => {
           if (position <= 0) {
             clearInterval(downInterval);
             isJumping = false;
           }
           position -= 5;
           position *= gravity;
           dino.style.bottom = position + 'px';
         }, 20);
       }
       position += 30;
       dino.style.bottom = position + 'px';
     }, 20);
   }
   function moveObstacle() {
     let obstaclePosition = obstacle.offsetLeft;
     let timerId = setInterval(() => {
       if (obstaclePosition <= -20) {
         clearInterval(timerId);
         obstacle.style.left = '600px';
         moveObstacle();
       }
       obstaclePosition -= 10;
       obstacle.style.left = obstaclePosition + 'px';
     }, 20);
   }
   moveObstacle();
 </script>
</body>
</html>
